<!doctype html>
<html>
  <head>
    <title>Question 3</title>

    <style>
      body {
        display: flex;
        margin: 0;
        height: 100vh;
      }

      .box1 {
        width: 50%;
        padding-top: 140px;
        box-sizing: border-box;
        background: white;
      }

      .box2 {
        width: 50%;
        height: 100vh;
        background: linear-gradient(to bottom, #d3b3e0, #dccbdf 55%, #f2e398);
      }

      .infobox {
        width: 100%;
        max-width: 600px;
        padding: 25px;
        box-sizing: border-box;
        margin: auto;
      }

      h2 {
        color: #c96f5d;
        font-family: Arial;
        font-size: 40px;
        margin: 0 0 20px;
      }

      label {
        font-size: larger;
        font-family: sans-serif;
      }

      input[type="email"],
      input[type="password"] {
        width: 100%;
        height: 38px;
        padding: 6px 10px;
        box-sizing: border-box;
        margin-bottom: 20px;
      }

      input[type="submit"] {
        width: 100%;
        height: 42px;
        margin-top: 20px;
        color: white;
        background: #c96f5d;
        border: none;
        font-weight: bold;
        letter-spacing: 2px;
        font-size: 18px;
      }

      @media only screen and (max-width: 600px) {
        .box2 {
          display: none;
        }

        .box1 {
          width: 100%;
          padding: 20px;
          padding-top: 120px;
        }
      }
    </style>
  </head>

  <body>
    <div class="box2"></div>

    <div class="box1">
      <div class="infobox">
        <h2>Login Form</h2>

        <form>
          <label for="Email"><b>Email:</b></label
          ><br />
          <input type="email" id="Email" required />

          <label for="Password"><b>Password:</b></label
          ><br />
          <input type="password" id="Password" required />
          <br />
          <input type="checkbox" id="Check" />
          <label for="Check">Remember me</label><br />

          <input type="submit" value="Login" />
        </form>
      </div>
    </div>
  </body>
</html>
